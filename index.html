<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive To-Do List (jQuery)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <h1>📝 My To-Do List</h1>

    <!-- Add task form -->
    <form id="task-form" autocomplete="off">
      <input type="text" id="task-input" placeholder="Enter a new task..." maxlength="100">
      <button type="submit" id="add-btn">Add</button>
    </form>
    <p id="error-msg" class="error"></p>

    <!-- Search -->
    <input type="text" id="search-input" placeholder="🔍 Search tasks...">

    <!-- Counters -->
    <div class="stats">
      <span>Total: <strong id="total-count">0</strong></span>
      <span>Completed: <strong id="done-count">0</strong></span>
      <span>Pending: <strong id="pending-count">0</strong></span>
    </div>

    <!-- Action buttons -->
    <div class="actions">
      <button id="toggle-list" class="secondary">Hide List</button>
      <button id="clear-completed" class="danger">Clear Completed</button>
    </div>

    <!-- Task list -->
    <div id="list-wrapper">
      <ul id="task-list"></ul>
      <p id="empty-msg">No tasks yet. Add one above! 🎉</p>
    </div>
  </main>

  <script src="js/jquery.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
